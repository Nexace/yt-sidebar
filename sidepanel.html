<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YT Sidebar</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header id="bar">
    <div id="tabs">
      <button data-app="music" title="YouTube Music">Music</button>
      <button data-app="yt" title="YouTube">YouTube</button>
    </div>
    <div id="controls">
      <button id="prev" title="Previous">⏮</button>
      <button id="play" title="Play / pause">⏯</button>
      <button id="next" title="Next">⏭</button>
      <button id="popout" title="Open in a new tab (continues where it is)">⧉</button>
      <button id="reload" title="Reload">⟳</button>
      <button id="instant" class="toggle" title="Instant hide: keep a muted copy of the song loaded so hiding the panel has no gap (about 120 MB extra while playing)">⚡</button>
      <button id="pin" class="toggle" title="Keep open when clicking outside the panel">📌</button>
    </div>
  </header>
  <iframe id="frame" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
